<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景流光渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- 主能量环渐变 (Antigravity Cyan to Indigo) -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- 顶层星芒紫金渐变 (Gemini Sparkle) -->
    <linearGradient id="purpleGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- 粒子光晕发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角背景徽章 -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- 浮空反重力轨道环 (Outer Antigravity Field) -->
  <g transform="translate(256, 256) rotate(-25)">
    <!-- 环外光晕 -->
    <ellipse cx="0" cy="0" rx="190" ry="70" fill="none" stroke="url(#cyanGrad)" stroke-width="14" opacity="0.85" filter="url(#glow)" stroke-dasharray="280 60 140 40" stroke-linecap="round" />
    <ellipse cx="0" cy="0" rx="190" ry="70" fill="none" stroke="#67e8f9" stroke-width="4" opacity="0.9" stroke-linecap="round" />
  </g>

  <!-- 反向微轨道环 (Inner Convergence Ring) -->
  <g transform="translate(256, 256) rotate(45)">
    <ellipse cx="0" cy="0" rx="140" ry="50" fill="none" stroke="url(#purpleGoldGrad)" stroke-width="8" opacity="0.75" stroke-dasharray="180 50 90 30" stroke-linecap="round" />
  </g>

  <!-- 核心反重力晶体 / 能量星核 (Antigravity Core & Sparkle) -->
  <g transform="translate(256, 256)" filter="url(#coreGlow)">
    <!-- 中央大星芒 (Gemini / AI Core) -->
    <path d="M 0 -110 Q 0 0 110 0 Q 0 0 0 110 Q 0 0 -110 0 Q 0 0 0 -110 Z" fill="url(#purpleGoldGrad)" />
    
    <!-- 内核高光四芒星 -->
    <path d="M 0 -70 Q 0 0 70 0 Q 0 0 0 70 Q 0 0 -70 0 Q 0 0 0 -70 Z" fill="#ffffff" opacity="0.9" />

    <!-- 核心微粒 -->
    <circle cx="0" cy="0" r="16" fill="#fef08a" />
  </g>

  <!-- 浮空上升反重力粒子 (Floating Levitation Particles) -->
  <!-- 左下上升微粒 -->
  <circle cx="140" cy="340" r="8" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="110" cy="270" r="5" fill="#818cf8" opacity="0.8" />
  <circle cx="170" cy="210" r="4" fill="#67e8f9" opacity="0.6" />

  <!-- 右上闪耀星芒 (Top Right Mini Star) -->
  <g transform="translate(380, 130) scale(0.4)" filter="url(#glow)">
    <path d="M 0 -60 Q 0 0 60 0 Q 0 0 0 60 Q 0 0 -60 0 Q 0 0 0 -60 Z" fill="url(#purpleGoldGrad)" />
  </g>
  <circle cx="350" cy="180" r="6" fill="#f59e0b" filter="url(#glow)" />
  <circle cx="390" cy="220" r="4" fill="#38bdf8" opacity="0.7" />

  <!-- 底部 API 桥接汇聚引力弧 (API Bridge Base) -->
  <path d="M 176 390 C 220 420, 292 420, 336 390" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85" filter="url(#glow)" />
</svg>
